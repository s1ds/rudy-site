<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Read Rudy's books in a page-turning flipbook.">
  <title>Rudy’s Books</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#fffdfa;--ink:#082553;--blue:#1268f6;--yellow:#ffc928;--red:#ff4b3e;--green:#18a76a;--line:#dce3ed;--soft:#eef5ff;--max:1450px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.5 "DM Sans",sans-serif}button,a{font:inherit;color:inherit}.shell{width:min(calc(100% - 48px),var(--max));margin:auto}.header{height:92px;display:flex;align-items:center}.header-in{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:13px;text-decoration:none;font:900 25px "Outfit"}.mark{width:46px;height:46px;background:var(--blue);display:block;position:relative;overflow:hidden}.mark:before{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:var(--yellow);right:5px;top:5px}.mark:after{content:"";position:absolute;width:30px;height:30px;background:var(--red);left:-7px;bottom:-18px;transform:rotate(45deg)}nav{display:flex;gap:34px}nav a{text-decoration:none;font-weight:800;padding:11px 2px;position:relative}nav a:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:4px;border-radius:5px;background:var(--blue);transform:scaleX(0)}nav a:hover:after,nav a[aria-current]:after{transform:scaleX(1)}nav a[aria-current]{color:var(--blue)}.menu{display:none;border:0;background:none;padding:10px}.title-row{padding:56px 0 34px;display:flex;align-items:end;justify-content:space-between;gap:30px}.title-row h1{font:900 clamp(58px,7vw,108px)/.88 "Outfit";letter-spacing:-.06em;margin:0}.title-row p{max-width:470px;margin:0;color:#586c87;font-size:18px}.workspace{display:grid;grid-template-columns:350px 1fr;gap:30px;padding-bottom:75px}.library{display:flex;flex-direction:column;gap:18px}.book-choice{border:2px solid var(--line);background:#fff;border-radius:24px;padding:20px;display:grid;grid-template-columns:104px 1fr;align-items:center;gap:20px;text-align:left;cursor:pointer;transition:.2s}.book-choice:hover,.book-choice[aria-pressed=true]{border-color:var(--blue);background:var(--soft);transform:translateY(-2px)}.cover{height:145px;border:2px solid var(--ink);background:#fff8dd;box-shadow:6px 7px 0 #08255318;display:grid;place-items:center;padding:10px;text-align:center;font:900 18px/1 "Outfit";color:var(--red)}.book-choice:nth-child(2) .cover{color:var(--blue);background:#e6f8ed}.book-choice h2{font:800 25px/1.05 "Outfit";letter-spacing:-.03em;margin:0 0 16px}.read{display:inline-flex;background:var(--blue);color:white;border-radius:99px;padding:10px 17px;font-weight:800}.reader{min-height:680px;border-radius:30px;background:#eef4fb;position:relative;display:flex;flex-direction:column;justify-content:center;padding:30px 48px 24px;overflow:hidden}.empty{text-align:center}.empty h2{font:800 38px "Outfit";margin:0 0 10px}.empty p{color:#586c87}.reader-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.reader-head h2{font:800 26px "Outfit";margin:0}.back{border:0;background:none;color:var(--blue);font-weight:800;cursor:pointer;display:none}.magazine-shell{height:520px;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none;user-select:none}.pageflip{width:100%;height:100%}.stf__parent{margin:auto!important}.stf__block{box-shadow:0 24px 34px #08255328}.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:18px}.round{width:54px;height:54px;border:0;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;cursor:pointer;transition:.2s}.round:hover:not(:disabled){transform:scale(1.06)}.round:disabled{opacity:.3;cursor:not-allowed}.round svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.5}.counter{min-width:120px;text-align:center;font-weight:800}.drag-hint{text-align:center;margin:10px 0 0;color:#60738d;font-size:14px}.decor{position:fixed;z-index:-1;border-radius:50%;pointer-events:none}.decor.one{width:190px;height:190px;background:var(--yellow);right:-75px;top:-72px}.decor.two{width:120px;height:120px;background:var(--green);left:-65px;bottom:-40px}.status{text-align:center;font-weight:700;color:#586c87}
    @media(max-width:1050px){.workspace{grid-template-columns:1fr}.library{display:grid;grid-template-columns:1fr 1fr}.reader{min-height:600px}}
    @media(max-width:680px){.shell{width:calc(100% - 28px)}.header{height:76px}.brand{font-size:21px}.mark{width:40px;height:40px}.menu{display:block}.header nav{display:none;position:absolute;z-index:20;top:70px;left:14px;right:14px;background:#fff;padding:14px;border:1px solid var(--line);box-shadow:0 18px 50px #08255325;border-radius:22px;flex-direction:column;gap:2px;text-align:center}.header nav.open{display:flex}.title-row{padding:36px 0 26px;align-items:start;flex-direction:column}.title-row h1{font-size:clamp(54px,17vw,76px)}.library{grid-template-columns:1fr}.book-choice{grid-template-columns:82px 1fr;padding:16px}.cover{height:112px;font-size:15px}.book-choice h2{font-size:22px;margin-bottom:12px}.reader{min-height:570px;padding:22px 10px;border-radius:24px}.reader-head{align-items:start;gap:8px;flex-direction:column;padding-inline:8px}.back{display:block}.magazine-shell{height:405px}.controls{margin-top:12px}.round{width:50px;height:50px}.drag-hint{font-size:13px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}:focus-visible{outline:4px solid #1268f655;outline-offset:4px}[hidden]{display:none!important}
  </style>
  <style>
    .reader-head-actions{display:flex;align-items:center;gap:12px}.fullscreen{display:inline-flex;align-items:center;gap:9px;border:1px solid #cbd7e7;background:#fff;border-radius:999px;padding:10px 15px;color:var(--ink);font-weight:800;cursor:pointer}.fullscreen:hover{border-color:var(--blue);color:var(--blue)}.fullscreen svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2}.magazine-shell{width:100%;height:auto;aspect-ratio:15/8;min-height:460px}.reader:fullscreen{width:100vw;height:100vh;max-width:none;border-radius:0;padding:18px 24px;background:#eaf2fc}.reader:fullscreen #viewer{height:100%;display:flex;flex-direction:column}.reader:fullscreen .magazine-shell{flex:1;min-height:0;aspect-ratio:auto}.reader:fullscreen .reader-head{margin-bottom:8px}.reader:fullscreen .controls{margin-top:8px}.reader:fullscreen .drag-hint{margin-top:5px}.reader:fullscreen .fullscreen{background:var(--blue);color:#fff;border-color:var(--blue)}
    @media(max-width:680px){.reader-head-actions{width:100%;justify-content:space-between}.fullscreen{padding:9px 12px}.fullscreen span{display:none}.magazine-shell{aspect-ratio:3/4;min-height:420px}.reader:fullscreen{padding:12px 8px}.reader:fullscreen .magazine-shell{min-height:0}}
  </style>
</head>
<body>
  <span class="decor one"></span><span class="decor two"></span>
  <header class="header"><div class="shell header-in"><a class="brand" href="/"><span class="mark" aria-hidden="true"></span>RUDY</a><button class="menu" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><nav aria-label="Main navigation"><a href="/">Home</a><a href="/books/" aria-current="page">Books</a><a href="/#games">Games</a></nav></div></header>
  <main class="shell">
    <div class="title-row"><h1>Rudy’s books</h1><p>Choose a book, then turn the pages with the arrow buttons or your keyboard.</p></div>
    <div class="workspace">
      <aside class="library" id="library" aria-label="Choose a book">
        <button class="book-choice" data-file="/media/books/Rudy Shapes Book 2.pdf" data-title="Rudy Shapes Book 2" aria-pressed="false"><span class="cover">RUDY’S<br>SHAPES<br>BOOK 2</span><span><h2>Rudy Shapes Book 2</h2><span class="read">Read book</span></span></button>
        <button class="book-choice" data-file="/media/books/steve and chieri degregorio - aninals.pdf" data-title="Animals" aria-pressed="false"><span class="cover">RUDY’S<br>ANIMALS</span><span><h2>Animals</h2><span class="read">Read book</span></span></button>
      </aside>
      <section class="reader" aria-live="polite">
        <div class="empty" id="empty"><h2>Pick a book to begin</h2><p>Your book will open here as a page-turning spread.</p></div>
        <div id="viewer" hidden>
          <div class="reader-head"><button class="back" type="button">← Back to all books</button><h2 id="reader-title"></h2><div class="reader-head-actions"><button class="fullscreen" id="fullscreen" type="button" aria-label="Open book in full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span>Full screen</span></button></div></div>
          <div class="magazine-shell"><div class="pageflip" id="pageflip" aria-label="Interactive magazine. Drag a page edge to turn."></div></div>
          <div class="controls"><button class="round" id="previous" aria-label="Previous pages"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span class="counter" id="counter"></span><button class="round" id="next" aria-label="Next pages"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div><p class="drag-hint">Drag a page corner—or swipe—to turn the page.</p>
        </div>
        <p class="status" id="status" hidden>Opening your book…</p>
      </section>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const choices=[...document.querySelectorAll('.book-choice')],library=document.querySelector('#library'),reader=document.querySelector('.reader'),viewer=document.querySelector('#viewer'),empty=document.querySelector('#empty'),status=document.querySelector('#status'),counter=document.querySelector('#counter'),previous=document.querySelector('#previous'),next=document.querySelector('#next'),fullscreen=document.querySelector('#fullscreen'),pageflipEl=document.querySelector('#pageflip');let pdf=null,pageFlip=null,pageUrls=[];
    function releasePages(){pageUrls.forEach(URL.revokeObjectURL);pageUrls=[];if(pageFlip){pageFlip.destroy();pageFlip=null}pageflipEl.innerHTML=''}
    async function renderPages(doc){const urls=[];for(let n=1;n<=doc.numPages;n++){status.textContent=`Preparing page ${n} of ${doc.numPages}…`;const p=await doc.getPage(n),base=p.getViewport({scale:1}),scale=Math.min(2,1400/base.width),view=p.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.round(view.width);canvas.height=Math.round(view.height);await p.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:view}).promise;const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));urls.push(URL.createObjectURL(blob))}return urls}
    function syncCounter(index){const page=index+1,isPortrait=matchMedia('(max-width:680px)').matches;counter.textContent=isPortrait?`${page} / ${pdf.numPages}`:`${page}${page+1<=pdf.numPages?'–'+(page+1):''} / ${pdf.numPages}`;previous.disabled=index===0;next.disabled=index>=pdf.numPages-1}
    async function openBook(button){choices.forEach(x=>x.setAttribute('aria-pressed',String(x===button)));empty.hidden=true;viewer.hidden=true;status.hidden=false;status.textContent='Opening your book…';releasePages();try{pdf=await pdfjsLib.getDocument(encodeURI(button.dataset.file)).promise;pageUrls=await renderPages(pdf);document.querySelector('#reader-title').textContent=button.dataset.title;status.hidden=true;viewer.hidden=false;if(matchMedia('(max-width:680px)').matches)library.hidden=true;pageFlip=new St.PageFlip(pageflipEl,{width:750,height:800,size:'stretch',minWidth:280,maxWidth:1100,minHeight:300,maxHeight:1100,drawShadow:true,flippingTime:900,usePortrait:true,startZIndex:0,autoSize:true,maxShadowOpacity:.55,showCover:false,mobileScrollSupport:false,clickEventForward:true,useMouseEvents:true,swipeDistance:18,showPageCorners:true,disableFlipByClick:false});pageFlip.loadFromImages(pageUrls);pageFlip.on('flip',e=>syncCounter(e.data));syncCounter(0)}catch(error){status.hidden=false;status.textContent='This book could not be opened. Please refresh and try again.'}}
    choices.forEach(button=>button.addEventListener('click',()=>openBook(button)));previous.addEventListener('click',()=>pageFlip&&pageFlip.flipPrev());next.addEventListener('click',()=>pageFlip&&pageFlip.flipNext());document.querySelector('.back').addEventListener('click',()=>{releasePages();viewer.hidden=true;empty.hidden=false;library.hidden=false;choices.forEach(x=>x.setAttribute('aria-pressed','false'))});fullscreen.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await reader.requestFullscreen();else await document.exitFullscreen()}catch(error){status.hidden=false;status.textContent='Full screen is not available in this browser.'}});document.addEventListener('fullscreenchange',()=>{const active=document.fullscreenElement===reader;fullscreen.setAttribute('aria-label',active?'Exit full screen':'Open book in full screen');fullscreen.querySelector('span').textContent=active?'Exit full screen':'Full screen';setTimeout(()=>window.dispatchEvent(new Event('resize')),80)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&pageFlip)pageFlip.flipNext();if(e.key==='ArrowLeft'&&pageFlip)pageFlip.flipPrev()});document.querySelector('.menu').addEventListener('click',e=>{const nav=document.querySelector('.header nav'),open=nav.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(open))});
  </script>
</body>
</html>
